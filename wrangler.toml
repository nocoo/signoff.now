# signoff.now — Cloudflare Worker + D1 (schema package lives in packages/db)
# Docs: docs/02-数据结构与D1.md
#
# Apply migrations:
#   bun run db:migrate:local
#   bun run db:migrate:remote

name = "signoff"
main = "packages/worker/src/index.ts"
compatibility_date = "2026-07-07"

# Production entry point. Cloudflare provisions the DNS record and certificate
# for a custom domain, so no separate DNS entry is needed.
routes = [{ pattern = "signoff.hexly.ai", custom_domain = true }]

# workers.dev stays on as a fallback: if the custom domain or its certificate
# misbehaves, `signoff.<subdomain>.workers.dev` is still a way in to check
# whether the Worker itself is healthy.
workers_dev = true

# Local: bun run dev:worker → :37042 with --local D1
[dev]
port = 37042

# SPA assets: Vite build output (run `bun run build:web` first).
[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "signoff-db"
database_id = "a94a2bfd-e1e9-4795-a282-eaf2beb9352b"
migrations_dir = "packages/db/migrations"
