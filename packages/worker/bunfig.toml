[test]
# Full lib + middleware + routes gate (only index/types/jose network path excluded)
coverageThreshold = { lines = 0.95, functions = 0.95, statements = 0.95 }
coveragePathIgnorePatterns = [
  "src/index.ts",
  "src/types.ts",
  "src/test/**",
  # Real JWKS network I/O only — injectable verifier covers access-auth
  "src/middleware/access-jose.ts",
  # Workspace domain package has its own ≥95% suite
  "**/packages/domain/**",
  "../domain/**",
]
# pipeline-ingest-write.ts and routes/pipeline.ts are NO LONGER excluded: the
# real-SQLite harness in src/test/sqlite-d1.ts exercises the multi-phase write
# path for real (06 §5.4 dispatch matrix, 05 §5.5 rejection matrix). Remaining
# uncovered lines there are defensive 500 paths (corrupt source_ids_json, batch
# UNIQUE races) that cannot be triggered without faking D1 failure injection.
